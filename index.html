<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="img/2_character_pepe/1_idle/idle/I-1.png" />
    <title>El pollo loco</title>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/game-state-manager.class.js"></script>
    <script type="module" src="models/audio-manager.class.js"></script>
    <script type="module" src="models/screen-manager.class.js"></script>
    <script src="models/character-movement-controller.class.js"></script>
    <script src="models/character-animation-controller.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/coin-status-bar.class.js"></script>
    <script src="models/bottle-status-bar.class.js"></script>
    <script src="models/endboss-status-bar.class.js"></script>
    <script src="models/world-status-controller.class.js"></script>
    <script src="models/world-collision-controller.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/world-renderer.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/endboss-chase-controller.class.js"></script>
    <script src="models/endboss-animation-controller.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
  </head>
  <body onload="init()" class="notranslate" translate="no">
    <main class="game-page notranslate" translate="no">
      <h1 class="game-title">El pollo loco</h1>
      <div class="canvas-shell notranslate" translate="no">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div id="runtime-controls">
          <button id="runtime-mute" class="icon-button" type="button" aria-label="Toggle sound">
            <img id="runtime-mute-icon" src="img/button_background_images/soundon.svg" alt="Toggle sound" />
          </button>
          <button id="runtime-pause" type="button" aria-label="Toggle pause" aria-pressed="false">Pause</button>
        </div>
        <div id="mobile-controls" class="mobile-button-container">
          <div class="mobile-controls-group mobile-controls-left">
            <button id="mobile-left" type="button" aria-label="Move left">
              <img src="img/button_background_images/arrowleft.svg" alt="Move left" />
            </button>
            <button id="mobile-right" type="button" aria-label="Move right">
              <img src="img/button_background_images/arrowright.svg" alt="Move right" />
            </button>
          </div>
          <div class="mobile-controls-group mobile-controls-right">
            <button id="mobile-jump" type="button" aria-label="Jump">
              <img src="img/button_background_images/arrowup.svg" alt="Jump" />
            </button>
            <button id="mobile-throw" type="button" aria-label="Throw bottle">
              <img src="img/button_background_images/throwbottle.svg" alt="Throw bottle" />
            </button>
          </div>
        </div>
        <div id="orientation-overlay" class="orientation-overlay notranslate" translate="no">
          <p>Rotate your device to landscape.</p>
        </div>
        <div id="game-overlay" class="game-overlay hidden notranslate" translate="no"></div>
      </div>
    </main>
  </body>
</html>
